<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bild &amp; Wort – Memory mit 6 Paaren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --radius:.875rem;
  --background:oklch(1 0 0); --foreground:oklch(.2 .02 345);
  --card:oklch(1 0 0);
  --primary:oklch(.3349 .142 345.67); --primary-foreground:oklch(1 0 0);
  --secondary:oklch(.965 0 0); --muted:oklch(.965 0 0); --muted-foreground:oklch(.5 .01 345);
  --accent:oklch(.9351 .2059 111.28); --accent-foreground:oklch(.3349 .142 345.67);
  --destructive:oklch(.58 .22 27); --border:oklch(.91 0 0); --input:oklch(.88 0 0);
  --success:oklch(.6 .17 148);
  --card-back:oklch(.3349 .142 345.67); --card-back-line:oklch(.42 .15 345.67);
  --shadow-card:0 1px 0 color-mix(in oklab,var(--foreground) 6%,transparent),0 10px 24px -14px color-mix(in oklab,var(--foreground) 40%,transparent);
  --shadow-match:0 0 0 4px var(--accent),0 12px 28px -14px color-mix(in oklab,var(--primary) 60%,transparent);
  --display:"Fraunces",Georgia,serif; --sans:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box;border-color:var(--border);margin:0}
body{background:var(--background);color:var(--foreground);font-family:var(--sans);}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
main{display:flex;flex-direction:column;gap:1rem;height:100dvh;overflow:hidden;padding:1rem 1.5rem}
@media(min-width:1024px){main{padding:1.5rem 2.5rem}}
header{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-shrink:0}
h1{font-family:var(--display);font-size:1.875rem;font-weight:700;line-height:1;color:var(--primary)}
@media(min-width:1024px){h1{font-size:2.25rem}}
.head-right{display:flex;align-items:center;gap:.75rem}
.points{display:flex;align-items:baseline;gap:.5rem;border-radius:999px;background:var(--primary);color:var(--primary-foreground);padding:.5rem 1.25rem}
.points b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.points span{font-size:.875rem;opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:999px;border:1px solid var(--input);background:var(--background);padding:.5rem 1rem;height:2.5rem;font-size:.875rem;font-weight:500;transition:background .15s}
.btn:hover{background:var(--accent)}
.btn svg{width:1rem;height:1rem}
.btn-accent{background:var(--accent);color:var(--accent-foreground);border-color:transparent;font-weight:600}
.btn-accent:hover{filter:brightness(.95);background:var(--accent)}
.btn-primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent;border-radius:.5rem}
.btn-primary:hover{background:var(--primary);opacity:.9}
.btn:disabled{opacity:.5;cursor:default}
.hidden{display:none!important}

/* Spielfeld */
#board-wrap{position:relative;min-height:0;flex:1}
.memory-board{display:grid;height:100%;gap:.75rem;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
@media(min-width:1024px){.memory-board{gap:1rem}}
@media(min-aspect-ratio:3/2){.memory-board{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}}
.memory-card{perspective:1200px;height:100%;min-height:0;width:100%;border:0;background:none;padding:0;border-radius:var(--radius)}
.memory-card:disabled{cursor:default}
.memory-card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.inner{position:relative;height:100%;width:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.memory-card[data-open="true"] .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-card)}
.front{transform:rotateY(180deg);border:1px solid var(--border);background:var(--card);text-align:left}
.back{display:flex;align-items:center;justify-content:center;transition:transform .15s;
  background-color:var(--card-back);
  background-image:radial-gradient(circle at center,var(--card-back-line) 1.5px,transparent 2px),
   linear-gradient(45deg,transparent 46%,var(--card-back-line) 47%,var(--card-back-line) 53%,transparent 54%),
   linear-gradient(-45deg,transparent 46%,var(--card-back-line) 47%,var(--card-back-line) 53%,transparent 54%);
  background-size:18px 18px,36px 36px,36px 36px}
.memory-card:not([data-open="true"]):hover .back{transform:scale(1.02)}
.q{display:flex;align-items:center;justify-content:center;width:3.5rem;height:3.5rem;border-radius:50%;background:var(--accent);color:var(--accent-foreground);font-family:var(--display);font-size:1.5rem;font-weight:700}
.memory-card[data-matched="true"] .front{box-shadow:var(--shadow-match)}
.front img{display:block;width:100%;height:100%;object-fit:cover}
.txt{display:flex;flex-direction:column;justify-content:center;gap:.75rem;height:100%;padding:1.25rem}
@media(min-width:1024px){.txt{padding:1.75rem}}
.txt small{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:var(--primary)}
.txt p{font-family:var(--display);font-size:clamp(1rem,1.5vw,1.75rem);line-height:1.35}

/* Punkte-Popup */
.popup{pointer-events:none;position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center}
.popup>div{display:flex;flex-direction:column;align-items:center;gap:.75rem;border:1px solid var(--border);background:var(--card);border-radius:calc(var(--radius)*2);padding:2rem 3rem;
  box-shadow:0 24px 60px -20px color-mix(in oklab,var(--primary) 55%,transparent);animation:score-pop 1.15s cubic-bezier(.2,.8,.2,1) both}
.popup .num{font-family:var(--display);font-size:6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
@media(min-width:1024px){.popup .num{font-size:8rem}}
.popup .num i{font-family:var(--sans);font-weight:900;font-style:normal}
.popup .plus{color:var(--success)} .popup .minus{color:var(--destructive)}
.popup .streak{display:flex;align-items:center;gap:.5rem;border-radius:999px;background:var(--accent);color:var(--accent-foreground);padding:.5rem 1.25rem;font-size:1.5rem;font-weight:700}
.popup .streak svg{width:2rem;height:2rem;fill:currentColor}
@keyframes score-pop{0%{transform:scale(.5);opacity:0}14%{transform:scale(1.12);opacity:1}24%{transform:scale(1);opacity:1}78%{transform:scale(1);opacity:1}100%{transform:scale(.96) translateY(-12px);opacity:0}}
@keyframes pop-in{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.pop-in{animation:pop-in .4s cubic-bezier(.2,.8,.2,1) both}

/* Ergebnis */
#results{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);gap:1.5rem;min-height:0;flex:1}
@media(min-width:1280px){#results{grid-template-columns:minmax(0,1fr) 420px}}
#results>section{min-height:0;height:100%}
@media(max-width:800px){#results{grid-template-columns:1fr;grid-template-rows:none;overflow-y:auto}#results>section{height:auto}}
#summary{list-style:none;padding:0;display:flex;flex-direction:column;gap:.75rem;height:100%}
@media(max-width:800px){#summary{height:auto}}
#summary li{display:flex;gap:1rem;min-height:0;flex:1 1 0;overflow:hidden}
#summary img{aspect-ratio:1;height:100%;width:auto;max-width:none;flex-shrink:0;border-radius:var(--radius);object-fit:cover;box-shadow:var(--shadow-card)}
@media(max-width:800px){#summary img{height:6rem}}
#summary .t{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1;overflow:hidden;border:1px solid var(--border);background:var(--card);border-radius:var(--radius);padding:.5rem 1.25rem;box-shadow:var(--shadow-card)}
#summary h3{font-family:var(--display);font-size:1.125rem;line-height:1.2;color:var(--primary)}
@media(min-width:1024px){#summary h3{font-size:1.25rem}}
#summary p{margin-top:.25rem;font-size:.875rem;line-height:1.35;color:var(--muted-foreground)}
@media(min-width:1280px){#summary p{font-size:1rem}}
.right{display:flex;flex-direction:column;gap:1rem;min-height:0}
.banner{display:flex;align-items:center;gap:1rem;flex-shrink:0;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);padding:1rem 1.25rem}
.banner svg{width:2rem;height:2rem;flex-shrink:0;color:var(--accent)}
.banner .b{flex:1}
.banner .b p:first-child{font-family:var(--display);font-size:1.5rem;font-weight:700}
.banner .b p:last-child{font-size:.875rem;opacity:.8}
aside{min-height:0;flex:1;overflow-y:auto;border:1px solid var(--border);background:var(--card);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--shadow-card)}
aside h2{display:flex;align-items:center;gap:.5rem;font-family:var(--display);font-size:1.5rem;color:var(--primary)}
aside h2 svg{width:1.25rem;height:1.25rem}
.save{margin-top:1.25rem;border-radius:.5rem;background:var(--secondary);padding:1rem}
.save .row{display:flex;align-items:baseline;justify-content:space-between}
.save .row span{font-size:.875rem;font-weight:600}
.save .row b{font-family:var(--display);font-size:1.875rem;font-variant-numeric:tabular-nums}
.save .row b small{margin-left:.25rem;font-size:.875rem;font-weight:400;color:var(--muted-foreground)}
.save form{display:flex;gap:.5rem;margin-top:.75rem}
.save input{flex:1;min-width:0;height:2.5rem;border:1px solid var(--input);background:var(--card);border-radius:.5rem;padding:0 .75rem}
.save input:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.save .ok{margin-top:.75rem;font-size:.875rem;font-weight:600;color:var(--success)}
.save .err{margin-top:.5rem;font-size:.875rem;color:var(--destructive)}
.top{margin-top:1.5rem;border-top:1px solid var(--border);padding-top:1rem}
.top .lbl{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:var(--muted-foreground)}
.top .info{padding:1rem 0;font-size:.875rem;color:var(--muted-foreground)}
.top ol{list-style:none;padding:0;margin-top:.5rem;display:flex;flex-direction:column;gap:.25rem}
.top li{display:flex;align-items:center;gap:.75rem;border-radius:.375rem;padding:.5rem .75rem;font-size:.875rem}
.top li.alt{background:var(--muted)} .top li.mine{background:var(--accent);color:var(--accent-foreground)}
.top li .rk{width:1.5rem;font-family:var(--display);font-weight:700}
.top li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.top li .mv{font-size:.75rem;color:var(--muted-foreground)} .top li.mine .mv{color:inherit;opacity:.8}
.top li .sc{width:3.5rem;text-align:right;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <header>
    <h1>Bild &amp; Wort</h1>
    <div class="head-right">
      <div class="points"><b id="points">0</b><span>Punkte</span></div>
      <button class="btn" id="shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Neu mischen</button>
    </div>
  </header>

  <section id="board-wrap" aria-label="Spielfeld"><div class="memory-board" id="board"></div></section>

  <div id="results" class="hidden">
    <section aria-label="Alle Paare im Überblick"><ul id="summary"></ul></section>
    <div class="right">
      <div class="banner pop-in">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.6L22.5 17.5l-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>
        <div class="b"><p id="res-points"></p><p id="res-moves"></p></div>
        <button class="btn btn-accent" id="again">Nochmal</button>
      </div>
      <aside>
        <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>Rangliste</h2>
        <div class="save" id="save"></div>
        <div class="top"><p class="lbl">Top 10</p><div id="top"></div></div>
      </aside>
    </div>
  </div>
</main>

<script>
/* ===== Inhalt: Bilder & Texte ===== */
// Bilder liegen im Ordner "bilder" neben dieser Datei.
// Eigene Bilder: Dateien in "bilder" mit gleichem Namen überschreiben (paar-1.jpg … paar-6.jpg)
// oder hier bei "image" den Dateinamen ändern, z. B. `${BILDER_ORDNER}/mein-hund.png`.
const BILDER_ORDNER = "bilder";
const PAIRS = [
  {id:"fuchs",title:"Fotografieren",image:`${BILDER_ORDNER}/paar-1.jpg`,alt:"Mediamatiker mit Fotoapparat",
   text:"Fotografieren",
   details:"Das Fotografieren gehört in der Lehre zum Mediamatiker, weil Websites, Social Media und Printprodukte oft eigene Bilder brauchen. Dabei lernt man, auf Licht, Bildaufbau und Perspektive zu achten und die Fotos danach zu bearbeiten. So wirken die Inhalte persönlicher und passen besser zum Betrieb als austauschbare Stockbilder"},
  {id:"ballon",title:"Kommunikation",image:`${BILDER_ORDNER}/paar-2.jpg`,alt:"Mediamatiker in einem Onlinegespräch mit einem Kunden",
   text:"Kommunikation",
   details:"Kundenkontakt gehört in der Lehre zum Mediamatiker, weil man Projekte meistens für andere umsetzt und deren Wünsche genau verstehen muss. Dabei lernt man, Bedürfnisse zu erfragen, Ideen verständlich zu präsentieren und Lösungen freundlich und professionell zu erklären. Auch bei Rückmeldungen oder Änderungswünschen ist eine klare Kommunikation wichtig, damit am Ende das Ergebnis passt und die Kunden zufrieden sind."},
  {id:"leuchtturm",title:"Social Media",image:`${BILDER_ORDNER}/paar-3.jpg`,alt:"Mediamatiker während des Videodrehs mit einem Gimball",
   text:"Social Media",
   details:"Social Media gehört in der Lehre zum Mediamatiker, weil Betriebe heute über Plattformen wie Instagram, LinkedIn oder TikTok mit ihren Kunden in Kontakt bleiben. Dabei lernt man, Beiträge zu planen, passende Bilder, Videos und Texte zu erstellen und die Zielgruppe gezielt anzusprechen. Auch das Beantworten von Kommentaren und das Auswerten der Reichweite gehört dazu, damit die Inhalte besser ankommen."},
  {id:"katze",title:"Die Katze am Fenster",image:`${BILDER_ORDNER}/paar-4.jpg`,alt:"Katze am Fenster",
   text:"Eine getigerte Katze sitzt am Fenster und schaut dem Regen zu.",
   details:"Eine getigerte Katze sitzt mit dem Rücken zu uns auf einem hölzernen Fensterbrett, umgeben von Topfpflanzen und weissen Geranien. Draussen prasselt der Regen auf die Dächer. Katzen beobachten gerne Bewegungen – Regentropfen an der Scheibe sind für sie spannendes Kino."},
  {id:"boot",title:"Das Ruderboot",image:`${BILDER_ORDNER}/paar-5.jpg`,alt:"Ruderboot auf dem Bergsee",
   text:"Ein Kind und ein Hund rudern bei Sonnenaufgang über einen Bergsee.",
   details:"Ein Kind mit roter Mütze und ein goldbrauner Hund sitzen in einem Holzboot mitten auf dem See. Die Sonne geht hinter den Gipfeln auf, Nebel liegt über dem Wasser und den Tannen am Ufer. Morgennebel entsteht, wenn die Luft über dem noch warmen See in der Nacht abkühlt."},
  {id:"baer",title:"Der Bär am Wasserfall",image:`${BILDER_ORDNER}/paar-6.jpg`,alt:"Bär am Wasserfall",
   text:"Ein Bär fängt am Wasserfall einen Lachs.",
   details:"Ein Braunbär steht im schäumenden Wasser und hält einen silbrig-roten Lachs im Maul. Im Hintergrund leuchten herbstliche Bäume. Im Herbst schwimmen Lachse flussaufwärts – Bären warten an Wasserfällen, wo die Fische in die Höhe springen."}
];
const PAIRS_BY_ID = Object.fromEntries(PAIRS.map(p => [p.id, p]));

/* ===== Spiellogik (wie im Original) ===== */
const POINTS_PER_PAIR = 100, MISS_PENALTY = -20;
const MISMATCH_DELAY = 1100, RESULTS_DELAY = 1200;
const pointsForStreak = s => Math.max(1, s) * POINTS_PER_PAIR;
const buildDeck = () => PAIRS.flatMap(p => [
  {id:`${p.id}-image`, pairId:p.id, kind:"image"},
  {id:`${p.id}-text`,  pairId:p.id, kind:"text"}]);
function shuffle(items){
  const a=[...items];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const createGame = cards => ({cards, flipped:[], matched:[], points:0, streak:0, moves:0, lastEvent:null});
const isWaiting  = s => s.flipped.length === 2;
const isFinished = s => s.cards.length > 0 && s.matched.length * 2 === s.cards.length;

function flip(s, index){
  const card = s.cards[index];
  if(!card || isWaiting(s) || s.matched.includes(card.pairId) || s.flipped.includes(index)) return s;
  const flipped = [...s.flipped, index];
  if(flipped.length < 2) return {...s, flipped};
  const moves = s.moves + 1, seq = (s.lastEvent?.seq ?? 0) + 1;
  const first = s.cards[flipped[0]];
  if(first.pairId === card.pairId){
    const streak = s.streak + 1, delta = pointsForStreak(streak);
    return {...s, flipped:[], matched:[...s.matched, card.pairId], points:s.points+delta, streak, moves, lastEvent:{delta,streak,seq}};
  }
  return {...s, flipped, moves, streak:0, points:s.points+MISS_PENALTY, lastEvent:{delta:MISS_PENALTY,streak:0,seq}};
}
const resolve = s => isWaiting(s) ? {...s, flipped:[], streak:0} : s;

/* ===== Rangliste (Supabase REST) ===== */
const SUPA_URL = "https://hlhhngaaoioidslrabrp.supabase.co";
const SUPA_KEY = "sb_publishable_XmsGBkePC-85sPWoHuLh3A_28J0FcIf";
const H = {apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, "Content-Type":"application/json"};
const TABLE = `${SUPA_URL}/rest/v1/leaderboard_scores`;
async function fetchTop(){
  const r = await fetch(`${TABLE}?select=id,name,score,moves,created_at&order=score.desc,moves.asc,created_at.asc&limit=10`, {headers:H});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function submitScore(name, score, moves){
  const r = await fetch(`${TABLE}?select=id,name,score,moves,created_at`, {
    method:"POST", headers:{...H, Prefer:"return=representation"}, body:JSON.stringify({name, score, moves})});
  if(!r.ok) throw new Error(r.status);
  const entry = (await r.json())[0];
  const c = await fetch(`${TABLE}?select=id&score=gt.${score}`, {headers:{...H, Prefer:"count=exact", Range:"0-0"}});
  const total = parseInt((c.headers.get("content-range") || "").split("/")[1], 10);
  return {entry, rank:(isNaN(total) ? 0 : total) + 1};
}

/* ===== Oberfläche ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FLAME = '<svg viewBox="0 0 24 24"><path d="M12 2c1 3.5 5 5.5 5 10.5A5 5 0 0 1 7 13c0-2 1-3.5 2-4.5.3 1.5 1 2.2 1.8 2.5C10.5 8 10.5 5 12 2z"/></svg>';
let state, savedIds = [], timers = [];

function newGame(){
  timers.forEach(clearTimeout); timers = [];
  savedIds = [];
  state = createGame(shuffle(buildDeck()));
  $("results").classList.add("hidden");
  $("board-wrap").classList.remove("hidden");
  buildBoard(); update();
}

function buildBoard(){
  const board = $("board"); board.innerHTML = "";
  state.cards.forEach((card, index) => {
    const pair = PAIRS_BY_ID[card.pairId];
    const b = document.createElement("button");
    b.type = "button"; b.className = "memory-card";
    b.setAttribute("aria-label", "Verdeckte Karte");
    b.innerHTML = `<div class="inner"><div class="face back"><span class="q">?</span></div><div class="face front">` +
      (card.kind === "image"
        ? `<img src="${esc(pair.image)}" alt="${esc(pair.alt)}">`
        : `<div class="txt"><small>Beschreibung</small><p>${esc(pair.text)}</p></div>`) + `</div></div>`;
    b.addEventListener("click", () => onFlip(index));
    board.appendChild(b);
  });
}

function onFlip(index){
  const next = flip(state, index);
  if(next === state) return;
  const waitedBefore = isWaiting(state);
  state = next; update();
  if(isWaiting(state) && !waitedBefore){
    timers.push(setTimeout(() => { state = resolve(state); update(); }, MISMATCH_DELAY));
  }
  if(isFinished(state)){
    timers.push(setTimeout(showResults, RESULTS_DELAY));
  }
}

let lastSeq = 0;
function update(){
  $("points").textContent = state.points;
  [...$("board").children].forEach((b, i) => {
    const card = state.cards[i], pair = PAIRS_BY_ID[card.pairId];
    const matched = state.matched.includes(card.pairId);
    const open = matched || state.flipped.includes(i);
    b.dataset.open = open; b.dataset.matched = matched; b.disabled = open;
    b.setAttribute("aria-label", open ? (card.kind === "image" ? pair.alt : pair.text) : "Verdeckte Karte");
  });
  const ev = state.lastEvent;
  if(!ev){ lastSeq = 0; }
  else if(ev.seq !== lastSeq){
    lastSeq = ev.seq;
    document.querySelectorAll(".popup").forEach(p => p.remove());
    const plus = ev.delta > 0;
    const el = document.createElement("div");
    el.className = "popup"; el.setAttribute("role", "status");
    el.innerHTML = `<div><span class="num ${plus ? "plus" : "minus"}"><i>${plus ? "+" : "−"}</i>${Math.abs(ev.delta)}</span>` +
      (ev.streak >= 2 ? `<span class="streak">${FLAME} ${ev.streak} in Serie</span>` : "") + `</div>`;
    $("board-wrap").appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
}

function showResults(){
  $("board-wrap").classList.add("hidden");
  $("results").classList.remove("hidden");
  $("summary").innerHTML = PAIRS.map((p, i) =>
    `<li class="pop-in" style="animation-delay:${i * 70}ms"><img src="${esc(p.image)}" alt="${esc(p.alt)}">` +
    `<div class="t"><h3>${esc(p.title)}</h3><p>${esc(p.details)}</p></div></li>`).join("");
  $("res-points").textContent = `${state.points} Punkte!`;
  $("res-moves").textContent = `Alle Paare gefunden in ${state.moves} Zügen.`;
  renderSave(); loadTop();
}

function renderSave(){
  const box = $("save");
  box.innerHTML = `<div class="row"><span>Deine Punkte</span><b>${state.points}<small>Punkte</small></b></div>` +
    `<form><input maxlength="24" placeholder="Dein Name" aria-label="Name"><button class="btn btn-primary" type="submit">Eintragen</button></form><p class="err hidden"></p>`;
  const form = box.querySelector("form"), input = box.querySelector("input"), err = box.querySelector(".err"), btn = box.querySelector("button");
  try { input.value = localStorage.getItem("memory-player-name") || ""; } catch(e) {}
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = input.value.trim();
    if(!name){ err.textContent = "Bitte gib einen Namen ein."; err.classList.remove("hidden"); return; }
    if(name.length > 24){ err.textContent = "Höchstens 24 Zeichen."; err.classList.remove("hidden"); return; }
    err.classList.add("hidden"); btn.disabled = true; btn.textContent = "…";
    try {
      const {entry, rank} = await submitScore(name, state.points, state.moves);
      try { localStorage.setItem("memory-player-name", entry.name); } catch(e) {}
      savedIds.push(entry.id);
      form.remove();
      const ok = document.createElement("p"); ok.className = "ok";
      ok.textContent = `✓ Gespeichert als «${entry.name}» – Platz ${rank}`;
      box.appendChild(ok);
      loadTop();
    } catch(e2) {
      btn.disabled = false; btn.textContent = "Eintragen";
      err.textContent = "Speichern hat nicht geklappt. Bitte nochmals versuchen."; err.classList.remove("hidden");
    }
  });
}

async function loadTop(){
  const box = $("top");
  box.innerHTML = '<p class="info">Lädt …</p>';
  try {
    const data = await fetchTop();
    if(!data.length){ box.innerHTML = '<p class="info">Noch keine Einträge – sei die oder der Erste!</p>'; return; }
    box.innerHTML = "<ol>" + data.map((e, i) => {
      const mine = savedIds.includes(e.id);
      return `<li class="${mine ? "mine" : i % 2 === 0 ? "alt" : ""}"><span class="rk">${i === 0 ? "👑" : (i + 1) + "."}</span>` +
        `<span class="nm">${esc(e.name)}</span><span class="mv">${e.moves} Züge</span><span class="sc">${e.score}</span></li>`;
    }).join("") + "</ol>";
  } catch(e) {
    box.innerHTML = '<p class="info">Die Rangliste konnte nicht geladen werden.</p>';
  }
}

$("shuffle").addEventListener("click", newGame);
$("again").addEventListener("click", newGame);
newGame();
</script>
